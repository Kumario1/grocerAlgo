<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lakeline H-E-B route</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #211f1b;
      --muted: #706b62;
      --paper: #fffdf8;
      --red: #c8102e;
      --red-dark: #941126;
      --cream: #f4efe3;
      --line: #ded7ca;
      --green: #237a4b;
      --blue: #1769aa;
      font: 16px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; padding: .8rem clamp(1rem, 3vw, 2rem);
      color: white; background: var(--red);
    }
    header strong { font-size: 1.1rem; letter-spacing: -.01em; }
    header span { font-size: .82rem; opacity: .88; }
    main {
      display: grid; grid-template-columns: minmax(300px, 390px) 1fr;
      min-height: calc(100vh - 57px);
    }
    #panel {
      position: relative; z-index: 2; padding: 1.25rem;
      border-right: 1px solid var(--line); background: #fff;
    }
    h1 { margin: 0; font-size: 1.55rem; letter-spacing: -.035em; }
    .lede { margin: .3rem 0 1rem; color: var(--muted); font-size: .92rem; }
    .connection {
      padding: .9rem; margin-bottom: 1rem; border: 1px solid #efc2ca;
      border-radius: 10px; background: #fff4f5;
    }
    .connection p { margin: 0 0 .65rem; font-size: .9rem; }
    .connection-actions { display: flex; gap: .5rem; flex-wrap: wrap; }
    .button {
      min-height: 42px; padding: .55rem .9rem; border: 0;
      border-radius: 8px; color: #fff; background: var(--red);
      font-weight: 700;
    }
    .button:hover:not(:disabled) { background: var(--red-dark); }
    .button.secondary {
      color: var(--red); background: #fff; box-shadow: inset 0 0 0 1px var(--red);
    }
    .field-label { display: block; margin-bottom: .35rem; font-weight: 700; }
    .search-wrap { position: relative; }
    #search {
      width: 100%; min-height: 46px; padding: .7rem .85rem;
      border: 1px solid #aaa297; border-radius: 9px; background: #fff;
    }
    #search:focus { outline: 3px solid #f4b3bf; border-color: var(--red); }
    #search-status {
      min-height: 1.3rem; margin: .35rem 0; color: var(--muted);
      font-size: .82rem;
    }
    #suggestions {
      position: absolute; top: calc(100% + 1.4rem); left: 0; right: 0;
      z-index: 5; max-height: min(430px, 55vh); margin: 0; padding: .35rem;
      overflow-y: auto; border: 1px solid var(--line); border-radius: 10px;
      background: #fff; box-shadow: 0 12px 35px #33291526;
    }
    #suggestions:empty { display: none; }
    .suggestion {
      display: grid; grid-template-columns: 54px 1fr; gap: .7rem;
      width: 100%; padding: .6rem; border: 0; border-radius: 7px;
      text-align: left; color: inherit; background: transparent;
    }
    .suggestion:hover:not(:disabled), .suggestion.active {
      outline: 2px solid #f1a3b1; background: #fff4f5;
    }
    .suggestion img, .product-thumb {
      width: 54px; height: 54px; object-fit: contain; border-radius: 5px;
      background: var(--cream);
    }
    .product-name { display: block; font-weight: 700; line-height: 1.25; }
    .product-meta, .location {
      display: block; margin-top: .15rem; color: var(--muted); font-size: .78rem;
    }
    .stock { color: #a32636; font-weight: 700; }
    .list-head {
      display: flex; align-items: baseline; justify-content: space-between;
      margin: 1.2rem 0 .45rem;
    }
    .list-head h2 { margin: 0; font-size: 1rem; }
    #count { color: var(--muted); font-size: .8rem; }
    #draft { display: grid; gap: .5rem; margin: 0; padding: 0; list-style: none; }
    .entry {
      display: grid; grid-template-columns: 42px 1fr auto; gap: .6rem;
      align-items: center; padding: .65rem; border: 1px solid var(--line);
      border-radius: 9px; background: var(--paper);
    }
    .entry .product-thumb { width: 42px; height: 42px; }
    .entry.unroutable { border-color: #e2a3ad; background: #fff7f8; }
    .entry.pending { opacity: .62; }
    .entry-actions { display: grid; grid-template-columns: repeat(3, 30px); gap: 2px; }
    .icon-button {
      width: 30px; height: 30px; padding: 0; border: 1px solid var(--line);
      border-radius: 6px; color: var(--ink); background: #fff;
    }
    .remove { grid-column: 1 / -1; width: 100%; color: #9c2638; font-size: .75rem; }
    .quantity { display: grid; place-items: center; min-width: 30px; font-weight: 700; }
    #empty { margin: .8rem 0; color: var(--muted); font-size: .88rem; }
    #route-button { width: 100%; margin-top: 1rem; }
    #summary {
      margin-top: .8rem; padding-top: .8rem; border-top: 1px solid var(--line);
      font-size: .9rem;
    }
    #summary:empty { display: none; }
    #summary ol { padding-left: 1.45rem; }
    #summary li { margin: .3rem 0; }
    .warning { margin-top: .65rem; color: #9c2638; }
    #map-shell { position: relative; min-width: 0; background: var(--cream); }
    #map-title {
      position: absolute; top: 1rem; left: 1rem; z-index: 1;
      padding: .4rem .6rem; border-radius: 6px; color: var(--muted);
      background: #fffdf8dd; font-size: .78rem;
    }
    #map { width: 100%; height: calc(100vh - 57px); display: block; }
    .boundary { fill: #fff; stroke: #b8afa1; stroke-width: 3; }
    .fixture { fill: #d7d0c3; stroke: #c3baac; stroke-width: .6; }
    .map-label {
      fill: #817a70; font: 8px ui-sans-serif, system-ui; text-anchor: middle;
      pointer-events: none;
    }
    .aisle-label { font-size: 6px; font-weight: 700; }
    .route {
      fill: none; stroke: var(--blue); stroke-width: 4; stroke-linecap: round;
      stroke-linejoin: round; vector-effect: non-scaling-stroke;
    }
    .stop circle { fill: var(--red); stroke: #fff; stroke-width: 2; }
    .stop text, .term text {
      fill: #fff; font: bold 10px ui-sans-serif, system-ui;
      text-anchor: middle; dominant-baseline: central;
    }
    .stop.approx circle { fill: #fff; stroke: var(--red); stroke-width: 3; }
    .stop.approx text { fill: var(--red); }
    .term circle { fill: var(--green); stroke: #fff; stroke-width: 2; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; }
      #panel { border-right: 0; border-bottom: 1px solid var(--line); }
      #map { height: 65vh; }
      #map-title { position: static; margin: .7rem; display: inline-block; }
    }
  </style>
</head>
<body>
  <header>
    <strong>grocerAlgo</strong>
    <span>Lakeline H‑E‑B Plus! · #659</span>
  </header>
  <main>
    <section id="panel" aria-labelledby="page-title">
      <h1 id="page-title">Build your store route</h1>
      <p class="lede">Choose the exact products you plan to pick up.</p>

      <div id="connection" class="connection" hidden>
        <p id="connection-copy">Connect H‑E‑B to search Lakeline’s live catalog.</p>
        <div class="connection-actions">
          <button id="connect" class="button" type="button">Connect H‑E‑B</button>
          <button id="confirm" class="button secondary" type="button" hidden>
            I selected Lakeline #659
          </button>
        </div>
      </div>

      <label class="field-label" for="search">Search H‑E‑B products</label>
      <div class="search-wrap">
        <input id="search" type="search" autocomplete="off" disabled
          role="combobox" aria-autocomplete="list" aria-controls="suggestions"
          aria-expanded="false" aria-activedescendant=""
          placeholder="Try “milk” or “tortillas”">
        <div id="search-status" role="status" aria-live="polite"></div>
        <div id="suggestions" role="listbox" aria-label="Product suggestions"></div>
      </div>

      <div class="list-head">
        <h2>Your list</h2>
        <span id="count">0 products</span>
      </div>
      <p id="empty">Search above to add your first product.</p>
      <ul id="draft" aria-live="polite"></ul>
      <button id="route-button" class="button" type="button" disabled>
        Generate route
      </button>
      <div id="summary" aria-live="polite"></div>
    </section>

    <section id="map-shell" aria-label="Lakeline H-E-B route map">
      <div id="map-title">Current 41-aisle H‑E‑B Atlas map</div>
      <svg id="map" role="img" aria-label="Store floor map"></svg>
    </section>
  </main>

  <script>
    const STORE_ID = 659;
    const DRAFT_KEY = 'grocerAlgo:draft:v1:heb659';
    const DRAFT_VERSION = 1;
    const svg = document.querySelector('#map');
    const search = document.querySelector('#search');
    const searchStatus = document.querySelector('#search-status');
    const suggestions = document.querySelector('#suggestions');
    const draftList = document.querySelector('#draft');
    const routeButton = document.querySelector('#route-button');
    const summary = document.querySelector('#summary');
    const connection = document.querySelector('#connection');
    const connectionCopy = document.querySelector('#connection-copy');
    const connectButton = document.querySelector('#connect');
    const confirmButton = document.querySelector('#confirm');
    const NS = 'http://www.w3.org/2000/svg';

    let connected = false;
    let locating = false;
    let routeHasRun = false;
    let entries = [];
    let results = [];
    let activeResult = -1;
    let searchTimer;
    let searchRequest = 0;

    function svgElement(tag, attributes, parent = svg) {
      const node = document.createElementNS(NS, tag);
      for (const [key, value] of Object.entries(attributes)) {
        node.setAttribute(key, value);
      }
      parent.append(node);
      return node;
    }

    function textNode(tag, text, className) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      node.textContent = text;
      return node;
    }

    async function jsonFetch(url, options) {
      const response = await fetch(url, options);
      let body = {};
      try { body = await response.json(); } catch (_) {}
      if (!response.ok) {
        const error = new Error(body.detail || 'Request failed');
        error.status = response.status;
        throw error;
      }
      return body;
    }

    function showReconnect(message = 'Your H‑E‑B session needs to be reconnected. Your list is safe.') {
      connected = false;
      search.disabled = true;
      connection.hidden = false;
      connectionCopy.textContent = message;
      connectButton.hidden = false;
      confirmButton.hidden = true;
      updateRouteButton();
    }

    function applyStatus(status) {
      connected = Boolean(status.connected && status.map_ready);
      search.disabled = !connected;
      connection.hidden = connected;
      if (!connected) showReconnect(
        status.connected && !status.map_ready
          ? 'H‑E‑B’s map has changed. Rebuild and verify the #659 profile before routing.'
          : 'Connect H‑E‑B to search Lakeline’s live catalog.');
      updateRouteButton();
    }

    async function connectHEB() {
      connectButton.disabled = true;
      connectionCopy.textContent = 'Opening H‑E‑B… select Lakeline H‑E‑B Plus! #659 there.';
      try {
        await jsonFetch('/api/heb/connect', {method: 'POST'});
        connectButton.hidden = true;
        confirmButton.hidden = false;
      } catch (error) {
        connectionCopy.textContent = error.message;
      } finally {
        connectButton.disabled = false;
      }
    }

    async function confirmHEB() {
      confirmButton.disabled = true;
      connectionCopy.textContent = 'Verifying Lakeline #659 and its map…';
      try {
        applyStatus(await jsonFetch('/api/heb/connect/confirm', {method: 'POST'}));
        if (connected && entries.length) await locateEntries(entries);
      } catch (error) {
        connectionCopy.textContent = error.message;
      } finally {
        confirmButton.disabled = false;
      }
    }

    function renderMap(geometry) {
      svg.setAttribute('viewBox', `0 0 ${geometry.page.w} ${geometry.page.h}`);
      svgElement('polygon', {
        points: geometry.boundary.map(point => point.join(',')).join(' '),
        class: 'boundary',
      });
      for (const [x0, y0, x1, y1] of geometry.fixtures) {
        svgElement('rect', {
          x: x0, y: y0, width: x1 - x0, height: y1 - y0, class: 'fixture',
        });
      }
      for (const polygon of geometry.fixture_polys || []) {
        svgElement('polygon', {
          points: polygon.map(point => point.join(',')).join(' '),
          class: 'fixture',
        });
      }
      for (const [name, [x, y]] of Object.entries(geometry.anchors)) {
        if (['ENTRANCE', 'CHECKOUT', 'CHECKSTANDS'].includes(name)) continue;
        const label = svgElement('text', {
          x, y, class: `map-label ${name.startsWith('AISLE ') ? 'aisle-label' : ''}`,
        });
        label.textContent = name.replace('AISLE ', '');
      }
    }

    function baseProduct(product) {
      return {
        id: product.id,
        name: product.name,
        brand: product.brand,
        size: product.size,
        image_url: product.image_url,
        inventory_state: product.inventory_state,
        location_label: product.location_label,
        selectable: product.selectable,
      };
    }

    function saveDraft() {
      localStorage.setItem(DRAFT_KEY, JSON.stringify({
        version: DRAFT_VERSION,
        store_id: STORE_ID,
        entries: entries.map(entry => ({
          product: baseProduct(entry.product),
          quantity: entry.quantity,
        })),
      }));
    }

    function restoreDraft() {
      try {
        const draft = JSON.parse(localStorage.getItem(DRAFT_KEY));
        if (draft?.version !== DRAFT_VERSION || draft?.store_id !== STORE_ID) return;
        entries = draft.entries
          .filter(entry => entry?.product?.id && entry.quantity > 0)
          .map(entry => ({
            product: entry.product,
            quantity: entry.quantity,
            placement: null,
            pending: true,
          }));
      } catch (_) {
        localStorage.removeItem(DRAFT_KEY);
      }
      renderDraft();
    }

    function renderSuggestions() {
      suggestions.replaceChildren();
      search.setAttribute('aria-expanded', String(results.length > 0));
      results.forEach((product, index) => {
        const option = document.createElement('button');
        option.type = 'button';
        option.id = `suggestion-${index}`;
        option.className = `suggestion${index === activeResult ? ' active' : ''}`;
        option.setAttribute('role', 'option');
        option.setAttribute('aria-selected', String(index === activeResult));
        option.disabled = !product.selectable;
        const image = document.createElement('img');
        image.src = product.image_url || '';
        image.alt = '';
        const copy = document.createElement('span');
        copy.append(
          textNode('span', product.name, 'product-name'),
          textNode('span', [product.brand, product.size].filter(Boolean).join(' · '),
            'product-meta'),
          textNode('span', product.location_label || 'Location unavailable', 'location'),
        );
        if (!product.selectable) {
          copy.append(textNode('span', 'Out of stock', 'product-meta stock'));
        }
        option.append(image, copy);
        option.addEventListener('click', () => addProduct(product));
        suggestions.append(option);
      });
      search.setAttribute(
        'aria-activedescendant', activeResult >= 0 ? `suggestion-${activeResult}` : '');
    }

    async function runSearch() {
      const query = search.value.trim();
      const request = ++searchRequest;
      results = [];
      activeResult = -1;
      renderSuggestions();
      if (query.length < 3) {
        searchStatus.textContent = query ? 'Type at least 3 characters.' : '';
        return;
      }
      searchStatus.textContent = 'Searching Lakeline H‑E‑B…';
      search.setAttribute('aria-busy', 'true');
      try {
        const body = await jsonFetch(`/api/products?q=${encodeURIComponent(query)}`);
        if (request !== searchRequest) return;
        results = body.products;
        searchStatus.textContent = results.length
          ? `${results.length} products found`
          : 'No products found.';
        renderSuggestions();
      } catch (error) {
        if (request !== searchRequest) return;
        searchStatus.textContent = error.message;
        if (error.status === 503) showReconnect();
      } finally {
        if (request === searchRequest) search.removeAttribute('aria-busy');
      }
    }

    function updateRouteButton() {
      routeButton.disabled = !connected || !entries.length || locating;
      routeButton.textContent = locating ? 'Locating products…'
        : routeHasRun ? 'Update route' : 'Generate route';
    }

    function renderDraft() {
      draftList.replaceChildren();
      document.querySelector('#empty').hidden = entries.length > 0;
      document.querySelector('#count').textContent =
        `${entries.length} product${entries.length === 1 ? '' : 's'}`;
      entries.forEach(entry => {
        const row = document.createElement('li');
        row.className = `entry${entry.pending ? ' pending' : ''}` +
          `${entry.placement && !entry.placement.routable ? ' unroutable' : ''}`;
        const image = document.createElement('img');
        image.className = 'product-thumb';
        image.src = entry.product.image_url || '';
        image.alt = '';
        const copy = document.createElement('div');
        copy.append(
          textNode('span', entry.product.name, 'product-name'),
          textNode('span',
            entry.pending
              ? (connected ? 'Locating…' : 'Connect H‑E‑B to restore location')
              : entry.placement?.location_label || 'Cannot place on this map',
            'location'),
        );
        const actions = document.createElement('div');
        actions.className = 'entry-actions';
        const decrease = textNode('button', '−', 'icon-button');
        decrease.type = 'button';
        decrease.setAttribute('aria-label', `Decrease ${entry.product.name} quantity`);
        decrease.disabled = entry.quantity === 1;
        decrease.addEventListener('click', () => changeQuantity(entry.product.id, -1));
        const quantity = textNode('span', entry.quantity, 'quantity');
        quantity.setAttribute('aria-label', `Quantity ${entry.quantity}`);
        const increase = textNode('button', '+', 'icon-button');
        increase.type = 'button';
        increase.setAttribute('aria-label', `Increase ${entry.product.name} quantity`);
        increase.addEventListener('click', () => changeQuantity(entry.product.id, 1));
        const remove = textNode('button', 'Remove', 'icon-button remove');
        remove.type = 'button';
        remove.addEventListener('click', () => removeProduct(entry.product.id));
        actions.append(decrease, quantity, increase, remove);
        row.append(image, copy, actions);
        draftList.append(row);
      });
      updateRouteButton();
    }

    async function locateEntries(targets) {
      if (!targets.length || !connected) return;
      locating = true;
      targets.forEach(entry => entry.pending = true);
      renderDraft();
      try {
        const body = await jsonFetch('/api/products/locate', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({products: targets.map(entry => baseProduct(entry.product))}),
        });
        const byId = new Map(body.products.map(product => [product.id, product]));
        targets.forEach(entry => {
          entry.placement = byId.get(entry.product.id) || {routable: false};
          entry.pending = false;
        });
      } catch (error) {
        targets.forEach(entry => entry.pending = false);
        if (error.status === 503) showReconnect();
        searchStatus.textContent = error.message;
      } finally {
        locating = false;
        renderDraft();
      }
    }

    async function addProduct(product) {
      const existing = entries.find(entry => entry.product.id === product.id);
      if (existing) {
        existing.quantity += 1;
        saveDraft();
        renderDraft();
      } else {
        const entry = {product: baseProduct(product), quantity: 1,
          placement: null, pending: true};
        entries.push(entry);
        saveDraft();
        renderDraft();
        await locateEntries([entry]);
        if (routeHasRun) await generateRoute();
      }
      search.value = '';
      results = [];
      activeResult = -1;
      searchStatus.textContent = '';
      renderSuggestions();
      search.focus();
    }

    function changeQuantity(productId, delta) {
      const entry = entries.find(item => item.product.id === productId);
      entry.quantity = Math.max(1, entry.quantity + delta);
      saveDraft();
      renderDraft();
    }

    async function removeProduct(productId) {
      entries = entries.filter(entry => entry.product.id !== productId);
      saveDraft();
      renderDraft();
      if (!entries.length) {
        clearRoute();
        routeHasRun = false;
      } else if (routeHasRun) {
        await generateRoute();
      }
    }

    function clearRoute() {
      svg.querySelectorAll('.route, .stop, .term').forEach(node => node.remove());
      summary.replaceChildren();
    }

    function badge(x, y, label, className, radius) {
      const group = svgElement('g', {class: className});
      svgElement('circle', {cx: x, cy: y, r: radius}, group);
      const text = svgElement('text', {x, y}, group);
      text.textContent = label;
    }

    function renderRoute(body) {
      clearRoute();
      svgElement('polyline', {
        points: body.path.map(point => point.join(',')).join(' '),
        class: 'route',
      });
      badge(body.path[0][0], body.path[0][1], 'S', 'term', 11);
      badge(body.path.at(-1)[0], body.path.at(-1)[1], '$', 'term', 11);
      body.stops.forEach(stop =>
        badge(stop.x, stop.y, stop.n, `stop${stop.approx ? ' approx' : ''}`, 9));

      const headline = document.createElement('p');
      headline.append(
        textNode('strong', `${body.distance_m} m`),
        document.createTextNode(` · ${body.stops.length} stops`),
      );
      if (body.saved_m > 0) {
        headline.append(document.createTextNode(` · ${body.saved_m} m saved`));
      }
      const ordered = document.createElement('ol');
      body.stops.forEach(stop => {
        const row = document.createElement('li');
        row.textContent = `${stop.quantity > 1 ? `${stop.quantity} × ` : ''}${stop.item}`;
        row.append(textNode('span',
          ` — ${stop.location_label || 'store placement'}${stop.approx ? ' (approx.)' : ''}`,
          'location'));
        ordered.append(row);
      });
      summary.append(headline, ordered);
      if (body.unrouted.length) {
        const warning = textNode(
          'p',
          `Could not route: ${body.unrouted.map(item => item.item).join(', ')}.`,
          'warning',
        );
        summary.append(warning);
      }
    }

    async function generateRoute() {
      routeButton.disabled = true;
      routeButton.textContent = 'Routing…';
      try {
        const body = await jsonFetch('/api/route', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({items: entries.map(entry => ({
            product_id: entry.product.id,
            quantity: entry.quantity,
          }))}),
        });
        renderRoute(body);
        routeHasRun = true;
      } catch (error) {
        clearRoute();
        summary.replaceChildren(textNode('p', error.message, 'warning'));
        if (error.status === 503) showReconnect();
      } finally {
        renderDraft();
      }
    }

    search.addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(runSearch, 250);
    });
    search.addEventListener('keydown', event => {
      if (!results.length) return;
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        activeResult = (activeResult + 1) % results.length;
        renderSuggestions();
      } else if (event.key === 'ArrowUp') {
        event.preventDefault();
        activeResult = (activeResult - 1 + results.length) % results.length;
        renderSuggestions();
      } else if (event.key === 'Enter' && activeResult >= 0) {
        event.preventDefault();
        if (results[activeResult].selectable) addProduct(results[activeResult]);
      } else if (event.key === 'Escape') {
        results = [];
        activeResult = -1;
        renderSuggestions();
      }
    });
    connectButton.addEventListener('click', connectHEB);
    confirmButton.addEventListener('click', confirmHEB);
    routeButton.addEventListener('click', generateRoute);

    async function init() {
      restoreDraft();
      const [geometry, status] = await Promise.all([
        jsonFetch('/api/geometry'),
        jsonFetch('/api/heb/status'),
      ]);
      renderMap(geometry);
      applyStatus(status);
      if (connected && entries.length) await locateEntries(entries);
    }

    init().catch(error => {
      searchStatus.textContent = `Could not start: ${error.message}`;
    });
  </script>
</body>
</html>
